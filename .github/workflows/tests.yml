name: Numerical verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: node scripts/build-article.mjs
      - run: git diff --exit-code web/article.md web/article-fragment.html
      - run: node scripts/export-fixtures.mjs
      - run: python -m pip install numpy scipy
      - run: python scripts/verify_scipy.py
